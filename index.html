<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NoNeang">
<title>NoNeang</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
<style>
:root{--y:#FFD000;--y2:#FFE04D;--yl:#FFF3B0;--yll:#FFF8D6;--ink:#1F1F1F;--mut:#5E5E5E;--g:#F4F4F2;--coral:#FF7A59;--coralL:#FFE6E0;--green:#4FA374;--greenL:#E7F4EA;--lav:#ECE9FB;--sh:0 8px 24px rgba(31,31,31,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EDEDEA;color:var(--ink);font-family:'Google Sans','Anuphan',system-ui,sans-serif}
button,input{font-family:inherit;color:var(--ink)}
button{cursor:pointer}
a{color:var(--ink)}
#app{max-width:480px;min-height:100vh;margin:0 auto;background:#fff;position:relative;padding-bottom:96px;overflow-x:hidden}
.sr{position:absolute;left:-9999px}
.hero{background:var(--y);border-radius:0 0 36px 36px;padding:calc(18px + env(safe-area-inset-top)) 18px 70px;position:relative;overflow:hidden}
.hero .blob{position:absolute;border-radius:50%;background:var(--y2)}
.hero .row{position:relative;display:flex;align-items:center;gap:12px}
.hero h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.hero .sub{font-size:13px;font-weight:500}
.top{padding:calc(16px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:22px;font-weight:700}
.top .sub{font-size:12px;color:var(--mut)}
.back{width:44px;height:44px;border-radius:22px;border:none;background:var(--g);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero .back{background:#fff;box-shadow:0 6px 14px rgba(140,100,0,.18)}
.card{background:#fff;border-radius:28px;padding:14px;box-shadow:var(--sh);margin:12px 16px 0}
.lift{margin-top:-46px;position:relative}
.h2{margin:18px 20px 8px;font-size:18px;font-weight:700}
.btn{height:56px;border-radius:28px;border:none;background:var(--y);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none}
.btn.g{background:var(--g)}
.btn.w{background:#fff;box-shadow:0 6px 18px rgba(31,31,31,.08)}
.btn.ghost{background:#fff;border:2px dashed #E0D9C4}
.btn.danger{background:#fff;box-shadow:inset 0 0 0 2px #F0D6D3;color:#B3261E}
.link{background:none;border:none;font-size:14px;font-weight:600;color:var(--mut);min-height:44px;display:flex;align-items:center;justify-content:center;width:100%}
.chip{height:38px;padding:0 13px;border-radius:19px;border:none;background:var(--g);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--y);font-weight:700}
.seg{display:flex;gap:4px;background:var(--g);border-radius:22px;padding:4px}
.seg button{flex:1;height:38px;border-radius:18px;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 8px rgba(31,31,31,.1)}
.ic{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mut{color:var(--mut)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step{width:40px;height:40px;border-radius:20px;border:none;background:var(--g);font-size:20px;font-weight:700}
.step.y{background:var(--y)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--mut)}
.inp{display:flex;align-items:center;gap:6px;height:54px;border-radius:18px;background:var(--g);padding:0 14px}
.inp input{flex:1;min-width:0;border:none;background:transparent;font-size:19px;font-weight:700;outline:none}
.inp:focus-within{box-shadow:inset 0 0 0 2px var(--y)}
.search{width:100%;height:58px;border-radius:30px;border:none;box-shadow:0 10px 24px rgba(31,31,31,.10);padding:0 18px 0 48px;font-size:17px;background:#fff;outline:none}
.search:focus{box-shadow:0 10px 24px rgba(31,31,31,.10),inset 0 0 0 2px var(--y)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(31,31,31,.06);z-index:20}
.nav button{border:none;background:none;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--mut)}
.nav button.on{color:var(--ink);font-weight:700}
.nav .pill{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav button.on .pill{background:var(--y)}
.overlay{position:fixed;inset:0;background:rgba(31,31,31,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:20px}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:32px 32px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.handle{align-self:center;width:44px;height:5px;border-radius:3px;background:#ddd}
.modal{width:100%;max-width:400px;background:#fff;border-radius:32px;overflow:hidden}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:448px;background:#1F1F1F;color:#fff;border-radius:26px;padding:10px 12px;display:flex;align-items:center;gap:12px;z-index:50;animation:pop .35s ease}
@keyframes pop{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.size{border:none;border-radius:22px;background:var(--g);padding:12px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-height:146px}
.size.on{background:var(--yl);box-shadow:0 0 0 2.5px #E8B800}
.badge{font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;white-space:nowrap}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 30px 10px}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="layer"></div>
<script src="data.js"></script>
<script src="fooddb.js"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
